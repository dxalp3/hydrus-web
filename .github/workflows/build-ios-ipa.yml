name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios-ipa:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Hydrus-Web-unsigned-IPA
          path: ios/App/output/Hydrus-Web-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

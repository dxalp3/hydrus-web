name: Publish application release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ios:
    name: Build iPad/iPhone IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/App/output/Hydrus-Web-unsigned.ipa
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x android/gradlew scripts/build-android-apk.sh
      - run: bash scripts/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: release/android/Hydrus-Web-Android.apk
          if-no-files-found: error

  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: release/desktop/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - ios
      - android
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create release and upload applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Hydrus Web ${GITHUB_REF_NAME}" \
            --generate-notes
